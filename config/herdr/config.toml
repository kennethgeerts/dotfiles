onboarding = false

[theme]
name = "nord"
auto_switch = false

[ui]
sidebar_width = 42
sidebar_min_width = 28
sidebar_max_width = 50
sidebar_collapsed_mode = "hidden"
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"

[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "workspace", fg = "#d8dee9", bold = true, dim = false }],
  [{ token = "agent", fg = "#88c0d0", dim = false }, { token = "tab", fg = "#b48ead", dim = false }],
]
row_gap = 1

[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "workspace", fg = "#d8dee9", bold = true, dim = false }],
  [{ token = "branch", fg = "#b48ead", dim = false }, "git_status"],
]
row_gap = 1

[ui.toast]
delivery = "herdr"
delay_seconds = 2

[ui.sound]
enabled = true
